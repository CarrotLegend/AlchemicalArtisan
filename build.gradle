
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

def mcVersion = (findProperty('minecraft_version') ?: '1.20.1').toString()
def mcVersionRange = property('minecraft_version_range').toString()
def forgeVersion = (findProperty('forge_version') ?: '47.4.20').toString()
def mappingChannel = (findProperty('mapping_channel') ?: 'official').toString()
def mappingVersion = (findProperty('mapping_version') ?: '1.20.1').toString()

def modId = 'alchemicalartisan'
def modName = 'Alchemical Artisan'
def modGroup = 'com.carrot123.alchemicalartisan'
def modVersion = (findProperty('mod_version') ?: '1.0.0').toString()
def modLicense = property('mod_license').toString()
def modAuthors = 'carrotlegend'
def modDescription = 'A mod that combines magic, alchemy, and forging.'

def jeiVersion = '15.62.0.219'
def jeiVersionRange = '[15.62.0.219,16.0.0)'

version = modVersion
group = modGroup

base {
    archivesName = modId
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mappingChannel, version: mappingVersion
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', modId
        }

        server {
            property 'forge.enabledGameTestNamespaces', modId
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', modId
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', modId,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()

    maven {
        name = 'BlameJared'
        url = uri('https://maven.blamejared.com/')
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-${forgeVersion}"

    compileOnly fg.deobf("mezz.jei:jei-${mcVersion}-common-api:${jeiVersion}")
    compileOnly fg.deobf("mezz.jei:jei-${mcVersion}-forge-api:${jeiVersion}")
    runtimeOnly fg.deobf("mezz.jei:jei-${mcVersion}-forge:${jeiVersion}")

    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : mcVersion,
            minecraft_version_range: mcVersionRange,
            forge_version          : forgeVersion,
            forge_version_range    : '[47.4.0,)',
            loader_version_range   : '[47,)',
            mod_id                 : modId,
            mod_name               : modName,
            mod_license            : modLicense,
            mod_version            : modVersion,
            mod_authors            : modAuthors,
            mod_description        : modDescription,
            jei_version_range      : jeiVersionRange
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : modId,
                'Specification-Vendor'    : modAuthors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : modAuthors
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url = uri("${project.projectDir}/mcmodsrepo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
